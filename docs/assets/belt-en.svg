<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="The production line: a ticket drops in, robot arms stamp, plan, weld and seal it, and it leaves as a pull request.">
<title>The production line: a ticket drops in, robot arms stamp, plan, weld and seal it, and it leaves as a pull request.</title>
<style>
.pkg { animation: pkgA 14s ease-in-out infinite; }
.pkg g, .again g { animation: 14s step-end infinite; }
.pkg .note { animation-name: lnote; } .pkg .stamp { opacity: 0; animation-name: lstamp; } .pkg .bp { opacity: 0; animation-name: lbp; }
.crate { color: #22d3ee; }
.pkg .crate { opacity: 0; animation-name: lcrate; } .pkg .seal { opacity: 0; animation-name: lseal; } .pkg .carton { opacity: 0; animation-name: lcarton; }
@keyframes pkgA { 0% { transform: translate(20px, 150px); opacity: 0; } 3% { opacity: 1; } 7% { transform: translate(20px, 216px); }
  12%, 20% { transform: translate(74px, 216px); } 27%, 34% { transform: translate(218px, 216px); } 44%, 56% { transform: translate(506px, 216px); }
  72%, 80% { transform: translate(938px, 216px); } 84%, 91% { transform: translate(1082px, 216px); }
  96% { transform: translate(1146px, 216px); opacity: 1; } 97% { opacity: 0; } 100% { transform: translate(1146px, 222px); opacity: 0; } }
@keyframes lnote { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes lstamp { 0% { opacity: 0; } 16% { opacity: 1; } 50% { opacity: 0; } }
@keyframes lbp { 0% { opacity: 0; } 31% { opacity: 1; } 50% { opacity: 0; } }
@keyframes lcrate { 0% { opacity: 0; } 50% { opacity: 1; } 87% { opacity: 0; } }
@keyframes lseal { 0% { opacity: 0; } 76% { opacity: 1; } 98% { opacity: 0; } }
@keyframes lcarton { 0% { opacity: 0; } 87% { opacity: 1; } 98% { opacity: 0; } }
.again { opacity: 0; animation: pkgB 28s ease-in-out 9s infinite both; }
.again .crate { opacity: 1; animation: lbad 28s step-end 9s infinite both; }
@keyframes pkgB { 0% { transform: translate(506px, 216px); opacity: 0; } 2% { opacity: 1; } 8%, 14% { transform: translate(650px, 216px); }
  17% { transform: translate(650px, 262px); } 25% { transform: translate(506px, 262px); }
  28% { transform: translate(506px, 216px); opacity: 1; } 30%, 100% { transform: translate(506px, 216px); opacity: 0; } }
@keyframes lbad { 0% { color: #22d3ee; } 9% { color: #ff5a4e; } 28% { color: #22d3ee; } }
.arm { animation: 14s ease-in-out infinite; }
.a1 { animation-name: arm1; } .a2 { animation-name: arm2; } .a4 { animation-name: arm4; } .a4b { animation-name: arm4b; } .a7 { animation-name: arm7; }
@keyframes arm1 { 0%, 13%, 19%, 100% { transform: none; } 15%, 17% { transform: translateY(13px); } }
@keyframes arm2 { 0%, 28%, 34%, 100% { transform: none; } 30%, 32% { transform: translateY(13px); } }
@keyframes arm4 { 0%, 45%, 55%, 100% { transform: none; } 47%, 53% { transform: translateY(13px); } 49%, 51% { transform: translateY(9px); } }
@keyframes arm4b { 0%, 45%, 55%, 100% { transform: none; } 47%, 53% { transform: translateY(13px); } 50% { transform: translateY(9px); } }
@keyframes arm7 { 0%, 73%, 79%, 100% { transform: none; } 75%, 77% { transform: translateY(13px); } }
.spark { opacity: 0; animation: 14s linear infinite; }
.s1 { animation-name: sp1; } .s2 { animation-name: sp2; } .s3 { animation-name: sp3; }
@keyframes sp1 { 0%, 47% { opacity: 0; transform: none; } 48% { opacity: 1; } 51% { opacity: 0; transform: translate(-26px, -20px); } }
@keyframes sp2 { 0%, 49% { opacity: 0; transform: none; } 50% { opacity: 1; } 53% { opacity: 0; transform: translate(24px, -22px); } }
@keyframes sp3 { 0%, 48% { opacity: 0; transform: none; } 49% { opacity: 1; } 52% { opacity: 0; transform: translate(4px, -30px); } }
.ok { animation: lok 14s step-end infinite; } .no { animation: lno 28s step-end 9s infinite both; }
@keyframes lok { 0% { fill: #3a3a40; } 59% { fill: #5bd68a; } 65% { fill: #3a3a40; } }
@keyframes lno { 0% { fill: #3a3a40; } 8% { fill: #ff5a4e; } 16% { fill: #3a3a40; } }
@media (prefers-reduced-motion: reduce) {
  .pkg, .again, .arm, .spark, .ok, .no, .pkg g, .again g { animation: none !important; }
  .pkg { transform: translate(506px, 216px); } .pkg .note { opacity: 0; } .pkg .crate { opacity: 1; }
  .again { opacity: 1; transform: translate(938px, 216px); }
}
</style>

name: factory record-outcome

# What the human did with a factory pull request (merged or closed) is the
# yardstick for the advisory stations. Called from the product repository.
on:
  workflow_call:
    inputs:
      runner:
        description: Where the small control jobs of the factory run, as JSON for runs-on (a self-hosted label such as factory-mac keeps everything on one machine)
        type: string
        default: '["ubuntu-latest"]'
      branch:
        type: string
        required: true
      merged:
        type: boolean
        required: true
      base:
        type: string
        default: ''

permissions: {}

jobs:
  record:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      actions: write   # a merged part starts the parts that waited for it
    steps:
      # A self-hosted runner keeps its checkout, and git still lists the worktrees the factory
      # made in RUNNER_TEMP, which is gone now. Those worktrees hold their branches, so the
      # checkout below cannot delete them and recreates the whole directory instead, losing
      # every build cache in it (Unity's Library/). Pruning releases them first.
      - name: Release worktrees of earlier jobs
        if: runner.environment != 'github-hosted'
        shell: bash
        run: git -C "$GITHUB_WORKSPACE" worktree prune 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          # A self-hosted runner keeps ignored build caches (Unity's Library/) in its checkout.
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: HanSur94/software-factory@main
        with:
          command: human-outcome --repo . --branch ${{ inputs.branch }} --merged ${{ inputs.merged }}
        env:
          FACTORY_GH_TOKEN: ${{ github.token }}
          FACTORY_BASE: ${{ inputs.base || github.event.repository.default_branch }}

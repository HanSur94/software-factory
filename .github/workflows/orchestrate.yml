name: factory orchestrate

# Looks after every ticket of a project (factory/orchestrator.py): starts runs that
# broke off again, catches up on CI results that never arrived, and gives free slots
# to tickets that wait. Called on a schedule from the product repository.
on:
  workflow_call:
    inputs:
      runner:
        description: Where the small control jobs of the factory run, as JSON for runs-on (a self-hosted label such as factory-mac keeps everything on one machine)
        type: string
        default: '["ubuntu-latest"]'
      base:
        type: string
        default: ''
    # Only the backlog planner (backlog.enabled) calls a model in this workflow.
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  sweep:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30    # the first floor plan of a project takes an agent several minutes (factory/floormap.py)
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      # A self-hosted runner keeps its checkout, and git still lists the worktrees the factory
      # made in RUNNER_TEMP, which is gone now. Those worktrees hold their branches, so the
      # checkout below cannot delete them and recreates the whole directory instead, losing
      # every build cache in it (Unity's Library/). Pruning releases them first.
      - name: Release worktrees of earlier jobs
        if: runner.environment != 'github-hosted'
        shell: bash
        run: git -C "$GITHUB_WORKSPACE" worktree prune 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          # A self-hosted runner keeps ignored build caches (Unity's Library/) in its checkout.
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: HanSur94/software-factory@main
        with:
          command: orchestrate --repo .
        env:
          FACTORY_GH_TOKEN: ${{ github.token }}
          FACTORY_BASE: ${{ inputs.base || github.event.repository.default_branch }}
          FACTORY_CALLER_WORKFLOW: ${{ github.workflow_ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

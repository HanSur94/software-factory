async function followCleanup(p) {
  try {
    const st = (await (await fetch(`/api/cleanup?source=${encodeURIComponent(p.source)}`)).json()).status || {};
    if (st.running) { setTimeout(() => followCleanup(p), 10000); return; }
    if (space.data) loadSpace(true);   // sizes changed
    cleanupNote = st.error ? " Aufräumen fehlgeschlagen: " + st.error
      : ` aufgeräumt: ${gb(st.freed || 0)} frei geworden` + (st.skipped && st.skipped.length ? ` · übersprungen: ${st.skipped.join("; ")}` : "");
    if (st.done && st.done.length) cleanupNote += " · " + st.done.join("; ");
  } catch (e) { cleanupNote = " Stand des Aufräumens nicht lesbar"; }
  scopeHead(lastData ? lastData.projects || [] : []);
}

// Overview: every project as one tile with what needs you, what runs and what it cost.
// ---- the overview of every project -------------------------------------------------
const LANE = [["queue", "wartet", "q"], ["plan", "Planung", "p"], ["build", "Bau", "b"], ["verify", "Prüfung", "v"],
  ["attn", "braucht dich", "a"], ["done", "fertig", "d"]];
const TONE = { ok: "ok", done: "ok", warn: "warn", bad: "bad", info: "info" };
const hhmm = ts => new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const when = ts => {
  const d = new Date(ts), today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return hhmm(ts);
  if (d.toDateString() === y.toDateString()) return "gestern " + hhmm(ts);
  return d.toLocaleDateString("de-DE", { day: "numeric", month: "numeric" }) + " " + hhmm(ts);
};
const ticketHref = (projects, c) => { const p = projects.find(p => p.source === c.source); return p ? `${p.path}#t=${c.number}` : null; };
let feedAll = false;

function card_(cls, title, count, extra) {
  const box = el("section", "ov-card" + (cls ? " " + cls : ""));
  const h = el("h3"); h.append(el("span", null, title)); if (count != null) h.append(el("span", "count", String(count)));
  if (extra) h.append(extra);
  box.append(h); return box;
}

function chip(text, tone, title) {
  const c = el("span", "ov-chip" + (tone ? " " + tone : "")); c.append(el("span", "led " + (tone || "")), text);
  if (title) c.title = title; return c;
}

function health(projects, data) {
  const out = [];
  const sweeps = projects.flatMap(p => ((p.orchestrator || {}).sweeps || []).map(s => s.ts)).filter(Boolean).sort().reverse();
  const kicked = projects.map(p => (p.orchestrator || {}).kicked).filter(Boolean).sort().reverse();
  const orch = projects.some(p => p.orchestrator);
  if (orch) {
    const last = sweeps[0];
    const minutes = last ? (Date.now() - Date.parse(last)) / 60000 : null;
    const every = (projects.find(p => p.orchestrator) || {}).orchestrator.every_minutes || 40;
    out.push(last ? chip("Orchestrator " + ago(last), minutes > every * 2 ? "warn" : "ok", "letzter aufgezeichneter Lauf")
      : chip(kicked[0] ? "Orchestrator angestoßen " + ago(new Date(kicked[0] * 1000).toISOString()) : "Orchestrator: noch kein Lauf aufgezeichnet", "warn"));
  }
  const r = (data.overview || {}).runners;
  if (r) out.push(chip(`Runner ${r.busy} von ${r.online} beschäftigt`, r.busy >= r.online ? "warn" : "ok", "selbst gehostete GitHub-Runner auf diesem Rechner"));
  if (data.disk) { const low = data.disk.free_gb < data.disk.min_gb; out.push(chip(`${data.disk.free_gb} GB frei`, low ? "bad" : "ok", low ? `Unter ${data.disk.min_gb} GB: Tickets warten` : "freier Speicher")); }
  return out;
}

function situation(projects, all, data) {
  const running = all.filter(c => c.running).length, attn = all.filter(c => ATTN.includes(c.column)).length;
  const queued = all.filter(c => c.column === "queue" && !c.running).length;
  const days = ((data.overview || {}).stats || {}).days || [];
  const today = (days[days.length - 1] || {}).done || 0, yesterday = (days[days.length - 2] || {}).done || 0;
  const box = el("section", "ov-card ov-sit");
  const text = el("div", "ov-sit-text");
  const big = el("p", "ov-headline");
  const part = (n, word, cls) => { const s = el("span", n && cls ? cls : null); s.append(el("b", null, String(n)), " " + word); return s; };
  big.append(part(running, running === 1 ? "läuft" : "laufen", "live"), " · ", part(attn, attn === 1 ? "braucht dich" : "brauchen dich", "attn"), " · ", part(queued, "warten"));
  const chips = health(projects, data);
  const bad = chips.filter(c => c.classList.contains("bad")).length, warn = chips.filter(c => c.classList.contains("warn")).length;
  text.append(big, el("p", "ov-sub", `Heute ${today} fertig, gestern ${yesterday} · ` + (bad ? "etwas ist rot" : warn ? "etwas braucht einen Blick" : "Fabrik gesund")));
  const hs = el("div", "ov-chips"); hs.append(...chips);
  box.append(text, hs); return box;
}

function attentionCard(projects, all) {
  const list = all.filter(c => ATTN.includes(c.column)).sort((a, b) => ATTN.indexOf(a.column) - ATTN.indexOf(b.column));
  const box = card_("ov-attn" + (list.length ? "" : " calm"), "Braucht dich", list.length);
  if (!list.length) { box.append(el("p", "ov-empty", "Nichts offen. Die Fabrik kommt allein zurecht.")); return box; }
  const why = c => c.column === "review" ? "Pull Request wartet auf deinen Merge" : c.column === "waiting" ? (c.detail || "Rückfrage") : "angehalten" + (c.detail ? ": " + c.detail.split("\n")[0] : "");
  for (const c of list.slice(0, 6)) {
    const row = el("div", "ov-row");
    const main = el("a", "ov-main"); main.href = ticketHref(projects, c) || "#";
    main.append(el("span", "ov-title", `#${c.number} ${c.title}`), el("span", "ov-meta", `${projectName(projects, c)} · ${why(c)}`));
    row.append(main);
    const go = c.column === "review" && c.pr_url ? [c.pr_url, "Pull Request ↗"] : c.column === "waiting" && c.issue_url ? [c.issue_url, "Antworten ↗"] : null;
    if (go) { const a = link(go[0], go[1]); a.className = "ov-act"; row.append(a); }
    else { const a = el("a", "ov-act", "Ansehen ›"); a.href = main.href; row.append(a); }
    box.append(row);
  }
  if (list.length > 6) box.append(el("p", "ov-more", `+ ${list.length - 6} weitere`));
  return box;
}

const projectName = (projects, c) => (projects.find(p => p.source === c.source) || {}).name || "";

function runningCard(projects, all) {
  const list = all.filter(c => c.running);
  const box = card_("ov-run", "Läuft gerade", list.length);
  if (!list.length) { box.append(el("p", "ov-empty", "Gerade läuft kein Ticket.")); return box; }
  for (const c of list.slice(0, 6)) {
    const st = c.workflow.stations.filter(s => s.id !== "ci" && s.state !== "skipped");
    const now = st.find(s => s.state === "active") || st.find(s => s.state === "waiting");
    const a = el("a", "ov-row ov-main"); a.href = ticketHref(projects, c) || "#";
    const top = el("span", "ov-line"); top.append(el("span", "ov-title", `#${c.number} ${c.title}`), el("span", "ov-when", c.last ? ago(c.last.ts) : ""));
    const dots = el("span", "ov-steps"); dots.setAttribute("aria-label", `Station ${st.indexOf(now) + 1} von ${st.length}`);
    for (const s of st) { const d = el("i", s.state); d.title = s.title; dots.append(d); }
    const meta = el("span", "ov-line"); meta.append(dots, el("span", "ov-meta", `${now ? now.title : c.step} · ${projectName(projects, c)}` + (cardTokens(c) ? " · " + toks(cardTokens(c)) : "")));
    a.append(top, meta); box.append(a);
  }
  if (list.length > 6) box.append(el("p", "ov-more", `+ ${list.length - 6} weitere`));
  return box;
}

function projectsCard(projects, all) {
  const box = card_("ov-projects", "Projekte", projects.length);
  const legend = el("div", "ov-legend"); legend.setAttribute("aria-hidden", "true");
  for (const [, word, cls] of LANE) { const s = el("span"); s.append(el("i", "seg-" + cls), word); legend.append(s); }
  box.querySelector("h3").append(legend);
  for (const p of projects) {
    const mine = all.filter(c => c.source === p.source), n = counts(mine);
    const lanes = { queue: 0, plan: 0, build: 0, verify: 0, attn: 0, done: 0 };
    for (const c of mine) lanes[ATTN.includes(c.column) ? "attn" : c.column in lanes ? c.column : "queue"]++;
    const row = el("a", "ov-prow"); row.href = p.path;
    const name = el("span", "ov-pname");
    name.append(el("span", "led" + (n.running ? " run" : n.attn ? " warn" : " ok")), el("b", null, p.name));
    const sweep = ((p.orchestrator || {}).sweeps || [])[0], cap = sweep && sweep.capacity;
    const queued = lanes.queue;
    name.append(el("span", "ov-meta", cap ? `${cap.running} von ${cap.slots} Plätzen · ${queued} warten` : n.running ? `${n.running} laufen · ${queued} warten` : queued ? `${queued} warten` : "ruhig"));
    const bar = el("span", "ov-bar"); const total = mine.length || 1;
    const words = [];
    for (const [id, word, cls] of LANE) if (lanes[id]) {
      const s = el("i", "seg-" + cls); s.style.flexGrow = lanes[id]; s.title = `${word}: ${lanes[id]}`; bar.append(s); words.push(`${word} ${lanes[id]}`);
    }
    if (!mine.length) bar.append(el("i", "seg-q"));
    bar.setAttribute("role", "img"); bar.setAttribute("aria-label", words.join(", ") || "keine Tickets");
    const mid = el("span", "ov-pmid"); mid.append(bar, el("span", "ov-meta", words.join(" · ") || "noch keine Tickets"));
    const st = p.stats || {};
    const side = el("span", "ov-pside");
    side.append(el("b", null, MONEY ? usd(n.spent) : toks(n.tokens)), el("span", "ov-meta", st.merged ? `${st.merged} gemergt` : ""));
    row.append(name, mid, side); box.append(row);
  }
  return box;
}

function bars(days, field, cls, fmt) {
  const max = Math.max(1, ...days.map(d => d[field]));
  const wrap = el("div", "ov-bars " + cls);
  for (const d of days) {
    const b = el("i"); b.style.height = Math.max(d[field] ? 6 : 2, d[field] / max * 100) + "%";
    const date = new Date(d.day + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" });
    b.title = `${date}: ${fmt(d[field])}`; wrap.append(b);
  }
  wrap.setAttribute("role", "img");
  wrap.setAttribute("aria-label", days.map(d => `${d.day}: ${fmt(d[field])}`).join(", "));
  return wrap;
}

function throughputCard(data) {
  const st = (data.overview || {}).stats || {}, days = st.days || [];
  const box = card_("ov-trend", "Durchsatz · " + days.length + " Tage");
  if (!days.length) return box;
  const sum = days.reduce((n, d) => n + d.done, 0), active = days.filter(d => d.done || d.tokens).length || 1;
  const facts = el("div", "ov-facts");
  const fact = (v, l) => { const f = el("div"); f.append(el("b", null, v), el("span", null, l)); facts.append(f); };
  fact((sum / active).toLocaleString("de-DE", { maximumFractionDigits: 1 }), "fertig pro Arbeitstag");
  fact(st.merged ? Math.round(st.clean / st.merged * 100) + " %" : "–", "ohne Nacharbeit");
  fact(st.lead_hours != null ? dur(st.lead_hours * 3600) : "–", "Durchlauf (Median)");
  box.append(facts);
  box.append(el("div", "ov-label", "Gemergt pro Tag"), bars(days, "done", "done", v => `${v} gemergt`));
  box.append(el("div", "ov-label", "Tokens pro Tag"), bars(days, "tokens", "tok", v => toks(v)));
  const axis = el("div", "ov-axis"); axis.append(el("span", null, "vor " + (days.length - 1) + " Tagen"), el("span", null, "heute")); box.append(axis);
  if (st.rtk_saved) box.append(el("div", "ov-note", `RTK hat in ${days.length} Tagen etwa ${toks(st.rtk_saved)} Tokens Shell-Ausgabe weggekürzt.`));
  return box;
}

// Where the plan's window ends up at this pace: a straight line from its start to now.
const WINDOW_SECONDS = w => w === "five_hour" ? 5 * 3600 : 7 * 86400;
function projection(w, q) {
  if (q.used == null || !q.resets_at) return null;
  const now = Date.now() / 1000, len = WINDOW_SECONDS(w), elapsed = len - (q.resets_at - now);
  if (elapsed < len * 0.05 || elapsed > len || !q.used) return null;
  const rate = q.used / elapsed, end = q.used + rate * (q.resets_at - now);
  return { end, full: end >= 1 ? new Date((now + (1 - q.used) / rate) * 1000) : null };
}

function quotaRows(box, data, withProjection) {
  const windows = Object.entries(data.subscription || {});
  const live = data.subscription_source === "live";
  // Live numbers come straight from Claude; otherwise only what agents last reported while they ran.
  if (windows.length) box.append(el("div", "eyebrow", live ? "Claude-Abo · live von Claude abgefragt" : "Claude-Abo · zuletzt von Agenten gemeldet"));
  for (const [w, q] of windows) {
    const r = el("div", "q"), h = el("div", "q-head");
    h.append(el("span", "q-name", windowName(w, q)), el("span", "q-val", pct(q.used) + " verbraucht")); r.append(h);
    const pr = withProjection ? projection(w, q) : null;
    const bar = el("div", "meter" + (q.used >= 0.8 || (pr && pr.full) ? " high" : ""));
    bar.setAttribute("role", "meter"); bar.setAttribute("aria-label", windowName(w, q)); bar.setAttribute("aria-valuemin", "0"); bar.setAttribute("aria-valuemax", "100");
    bar.setAttribute("aria-valuenow", String(Math.round(q.used * 100)));
    const fill = el("i"); fill.style.width = Math.min(100, q.used * 100) + "%"; bar.append(fill);
    if (pr) { const ghost = el("b", "ghost"); ghost.style.left = Math.min(100, q.used * 100) + "%"; ghost.style.width = Math.max(0, Math.min(100, pr.end * 100) - q.used * 100) + "%"; bar.append(ghost); }
    r.append(bar);
    const reset = q.resets_at ? "Reset " + new Date(q.resets_at * 1000).toLocaleString("de-DE", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
    // Claude reports the plain 7-day and 5-hour windows for every model, others only for some.
    const only = ["seven_day", "five_hour"].includes(w) || !(q.models || []).length ? "" : "nur bei " + q.models.join(", ") + " gemeldet";
    const state = q.live ? [q.amount, q.active === false ? "greift gerade nicht" : "", "Stand " + new Date(q.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })]
      : [`gemessen ${ago(q.ts)}`, only];
    r.append(el("div", "q-sub", [reset, ...state].filter(Boolean).join(" · ")));
    if (pr) r.append(el("div", "q-sub q-pace" + (pr.full ? " warn" : ""), pr.full
      ? "Bei diesem Tempo voll am " + pr.full.toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" }) + ", vor dem Reset"
      : `Bei diesem Tempo etwa ${pct(Math.round(pr.end * 100) / 100)} bis zum Reset: reicht`));
    box.append(r);
  }
}

function quotaCard(data) {
  const box = el("section", "ov-card ov-quota");
  quotaRows(box, data, true);
  const days = ((data.overview || {}).stats || {}).days || [];
  if (days.length > 1) box.append(el("div", "q-sub", `Heute ${toks(days[days.length - 1].tokens)} Tokens · gestern ${toks(days[days.length - 2].tokens)}`));
  return box.childNodes.length ? box : null;
}

function feedCard(projects, data) {

    const li = el("li", "tone-" + (TONE[i.tone] || "info"));

    const t = el("time", null, when(i.ts)); t.dateTime = i.ts;

function home(projects, all, data) {
  const box = document.getElementById("home"); box.replaceChildren();
  if (SCOPE) return;
  if (!projects.length) {
    head(box, "h-home", "Projekte", 0, "");
    const p = el("p", "explain", "Noch kein Projekt verbunden. ");
    const a = el("a", null, "Projekt verbinden"); a.href = "/settings#verbinden"; p.append(a); box.append(p); return;
  }

  const pair = el("div", "ov-pair"); pair.append(attentionCard(projects, all), runningCard(projects, all)); box.append(pair);

// The newest answer of the board: a page switch draws from it at once and reads the board behind it.
let lastData = null;
// The board asks again every few seconds, but only while the tab is seen, and gets the answer only when it changed:
// an unchanged board answers 304 and the page draws nothing new. A hidden tab asks again as soon as it shows.
let boardTag = "", liveSeen = "";
async function refresh() {
  if (document.hidden) return;
  try {
    const [answer, live] = await Promise.all([fetch("/api/board", { headers: boardTag && lastData ? { "If-None-Match": boardTag } : {} }),
      fetch("/api/live").then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
    LIVE = (live && live.tickets) || {};
    const liveNow = JSON.stringify(LIVE);
    if (answer.status === 304 && lastData) {
      if (liveNow !== liveSeen) { liveSeen = liveNow; render(lastData); }
      return;
    }
    if (!answer.ok) throw new Error(answer.status === 503 ? "liest noch von GitHub …" : "Antwort " + answer.status);
    lastData = await answer.json();
    boardTag = answer.headers.get("ETag") || ""; liveSeen = liveNow;
    render(lastData);
  } catch (e) {
    const meta = document.getElementById("meta"); meta.replaceChildren();
    const s = el("span", "bad"); s.append(el("span", "led bad"), " Board nicht erreichbar: " + e.message); meta.append(s);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// A ticket's whole workflow (timeline, activity, review, the runs of each station) comes only for the open drawer.
const FULL = {};   // key -> {w, at} | {loading} | {failed, at}
function loadFull(c) {
  const k = key(c), have = FULL[k];
  if (have && (have.loading || (have.failed && Date.now() - have.at < 10000))) return;
  FULL[k] = { ...(have || {}), loading: true };
  fetch(`/api/card?source=${encodeURIComponent(c.source)}&number=${c.number}`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error("Antwort " + r.status)))
    .then(w => { FULL[k] = { w, at: Date.now() }; const x = cards.find(y => key(y) === k); if (x) x.workflow = w; draw(); })
    .catch(() => { FULL[k] = { ...(have || {}), loading: false, failed: true, at: Date.now() }; });
}
// The newest board answer wins; the drawer's details (and each station's runs) come from the last full read.
const withDetails = (full, lite) => ({ ...full, ...lite,
  stations: (lite.stations || []).map(s => ({ ...((full.stations || []).find(x => x.id === s.id) || {}), ...s })) });
const whole = c => !!(c && c.workflow && c.workflow.timeline);

function render(data) {
  {
    MONEY = !!data.show_cost;
    const projects = data.projects || [];
    if (!SCOPE && projects.length === 1) return location.replace(projects[0].path);   // one project: straight to its board
    here = SCOPE ? projects.find(p => p.path === SCOPE) || null : null;
    cards = here ? data.cards.filter(c => c.source === here.source) : SCOPE ? [] : data.cards;
    for (const c of cards) {
      const f = FULL[key(c)];
      if (f && f.w) c.workflow = withDetails(f.w, c.workflow);
      if (key(c) === selected && f && !f.loading && (!f.w || Date.now() - f.at > 5000)) loadFull(c);   // the open drawer follows the board
    }
    document.body.dataset.view = here ? "board" : SCOPE ? "missing" : "home";
    switcher(projects, data.cards);
    scopeHead(projects);
    // A ticket linked from the overview (/p/...#t=N) opens straight away.
    const asked = location.hash.match(/^#t=(\d+)$/);
    if (here && asked) { const c = cards.find(c => String(c.number) === asked[1]); if (c) selected = key(c); history.replaceState(null, "", location.pathname); }
    home(projects, data.cards, data);
    draw(data.columns);
    telemetry(data);
    const current = cards.find(c => key(c) === selected);
    if (current && station && current.running) load(current);      // follow a running station
    const active = cards.filter(c => c.running).length;
    const meta = document.getElementById("meta"); meta.replaceChildren();
    const live = el("span"); live.append(el("span", "led" + (active ? " run" : " ok")), " ", el("b", null, active ? `${active} aktiv` : "idle")); meta.append(live);
    const tk = el("span"); tk.append(el("b", null, String(cards.length)), " tickets"); meta.append(tk);
    const at = el("span"); at.append("sync ", el("b", null, data.updated)); meta.append(at);
    if (data.disk) {
      const low = data.disk.free_gb < data.disk.min_gb;
      const dk = el("span", low ? "bad" : null);
      dk.title = low ? `Unter ${data.disk.min_gb} GB frei: Tickets warten, bis Platz frei wird` : "freier Speicher dieses Rechners";
      dk.append(el("b", null, `${data.disk.free_gb} GB`), " frei"); meta.append(dk);
    }
    // Errors of other projects do not belong on this project's board.
    document.getElementById("errors").textContent = data.errors.filter(e => !here || e.startsWith(here.repo + ":")).join(" · ");
    if (!here) document.title = "Software Factory";
  }
}

// Moving between the overview and a project's board needs no new page: the data is already here.
function go(url, push) {
  const target = new URL(url, location.href);
  if (push) history.pushState(null, "", target.pathname + target.hash);
  const moved = scopeOf(target.pathname) !== SCOPE;
  SCOPE = scopeOf(target.pathname);
  if (moved) { selected = null; station = null; orchOpen = false; backlogRun = null; scrollTo(0, 0); }
  if (lastData) render(lastData);
  refresh();
}
document.addEventListener("click", e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest("a[href]");
  if (!a || a.target || a.origin !== location.origin) return;
  if (!(a.pathname === "/" || a.pathname.startsWith("/p/"))) return;
  if (a.pathname === location.pathname && !a.hash) { e.preventDefault(); return; }
  e.preventDefault(); go(a.href, true);
});
addEventListener("popstate", () => go(location.href, false));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (station) station = null; else if (backlogRun) backlogRun = null; else if (selected) selected = null; else if (orchOpen) orchOpen = false; else return;
  draw();
});
refresh(); setInterval(refresh, 8000);
</script>
</body>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/views.css">
<script src="/views.js"></script>
<style>
  main.page { padding: 18px 20px 40px; }
  body.open main.page { margin-right: min(460px, 100vw); }
  #errors:not(:empty) { margin: 0 0 14px; padding: 8px 12px; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); background: var(--bad-dim);
    border-radius: var(--r); color: var(--bad); font: 12px var(--mono); }

  /* Top: counters on the left, the subscription quota on the right */
  #top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; margin-bottom: 26px; }
  #top:has(#quota:empty) { grid-template-columns: 1fr; }
  @media (max-width: 1020px) { #top { grid-template-columns: 1fr; } }
  #kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .kpi { padding: 14px 18px 16px; border-left: 1px solid var(--line); min-width: 0; }
  .kpi:first-child { border-left: none; }
  #kpis { container-type: inline-size; }
  .kpi .val { font: 600 30px/1.05 var(--mono); margin-top: 12px; letter-spacing: -.02em; color: var(--text); white-space: nowrap; }
  @container (max-width: 640px) { .kpi .val { font-size: 24px; } .kpi { padding: 12px 14px 14px; } }
  .kpi .val small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
  .kpi .sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .kpi.live .val { color: var(--accent); }
  .kpi.attn { background: var(--warn-dim); } .kpi.attn .val { color: var(--warn); } .kpi.attn .eyebrow { color: var(--warn); }
  a.kpi { color: inherit; text-decoration: none; transition: background .15s; } a.kpi:hover { background: color-mix(in srgb, var(--warn) 18%, transparent); }
  @media (max-width: 560px) {
    #kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(3) { border-left: none; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
    .kpi .val { font-size: 24px; }
  }
  #quota { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  #quota:empty { display: none; }
  .q-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
  .q-name { font-size: 13px; color: var(--text-2); flex: 1 1 150px; min-width: 0; }
  .q-val { font: 600 15px var(--mono); color: var(--text); white-space: nowrap; }
  .q-sub { font: 12px/1.45 var(--mono); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .meter { height: 8px; border-radius: var(--r-sm); background: var(--surface-3); margin-top: 8px; overflow: hidden; position: relative; }
  .meter i { display: block; height: 100%; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--accent-deep), var(--accent)); }
  .meter.high i { background: linear-gradient(90deg, var(--warn-deep), var(--warn)); }
  .meter::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9.6%, color-mix(in srgb, var(--surface) 70%, transparent) 9.6% 10%); }

  /* Section heads */
  .block { margin-bottom: 30px; scroll-margin-top: calc(var(--appbar) + 14px); }
  .sectionhead { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin: 0 0 12px; }
  .sectionhead h2 { margin: 0; font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
  .sectionhead .count { font: 600 12px/1.6 var(--mono); padding: 0 8px; border-radius: var(--r-lg); background: var(--surface-3); color: var(--text-2); }
  .sectionhead .hint { font-size: 12.5px; color: var(--muted); }

  /* Project switcher: the overview plus one board per connected project */
  #projects { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; font: 12px var(--mono); }
  #projects:empty { display: none; }
  #projects a { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 12px; border: 1px solid var(--line-2);
                border-radius: var(--r-pill); background: var(--surface); color: var(--text-2); text-decoration: none; transition: border-color .15s, color .15s, background .15s; }
  #projects a:hover { border-color: var(--accent); color: var(--text); }
  #projects a[aria-current="page"] { border-color: var(--accent); background: var(--accent-dim); color: var(--text); font-weight: 600; }
  #projects .sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 2px; }
  #projects .badge { font: 600 12px/18px var(--mono); min-width: 18px; padding: 0 5px; border-radius: var(--r-lg); text-align: center; background: var(--warn-dim); color: var(--warn); }
  @media (pointer: coarse) { #projects a { min-height: 44px; } }
  @media (max-width: 620px) {   /* one row that scrolls sideways instead of a tall stack of pills */
    #projects { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; scroll-padding-inline: 16px; }
    #projects::-webkit-scrollbar { display: none; }
    #projects a { flex: none; white-space: nowrap; }
  }

  /* Head of one project's board */
  #scope:empty { display: none; }
  #scope { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 0 18px; }
  #scope h1 { margin: 0; font: 600 24px/1.2 var(--sans); letter-spacing: -.01em; color: var(--text); overflow-wrap: anywhere; }
  #scope .owner { font: 13px var(--mono); color: var(--muted); }
  #scope .cleanup { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font: 12.5px var(--mono); }
  #scope .cleanup .linkbtn { font: 500 12.5px var(--mono); color: var(--accent); }
  #scope .cleanup .muted { color: var(--muted); overflow-wrap: anywhere; }
  #scope a { font: 500 12.5px var(--mono); color: var(--accent); text-decoration: none; } #scope a:hover { text-decoration: underline; }
  #scope p { flex-basis: 100%; margin: 4px 0 0; color: var(--text-2); }

  /* Overview: one tile per project */
  #home:empty { display: none; }
  .ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
  .ptile { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 16px 16px 14px; background: var(--surface);
           border: 1px solid var(--line); border-radius: var(--r-lg); transition: border-color .15s, background .15s; }
  .ptile:hover { border-color: var(--accent); background: var(--card-hover); }
  .ptile:focus-within { border-color: var(--accent); }
  .ptile.attn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .ptile.running { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .ptile h3 { margin: 0; display: flex; align-items: center; gap: 9px; font: 600 17px/1.25 var(--sans); min-width: 0; }
  .ptile h3 a { color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  .ptile h3 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }   /* the whole tile opens the board */
  .ptile h3 a:focus-visible { outline: none; } .ptile:has(h3 a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ptile .owner { font: 12px var(--mono); color: var(--muted); margin-top: -8px; }
  .ptile .ext { position: absolute; top: 12px; right: 12px; z-index: 1; display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px;
                font: 500 12px var(--mono); color: var(--muted); text-decoration: none; border-radius: var(--r); }
  .ptile .ext:hover { color: var(--accent); background: var(--accent-dim); }
  .ptile dl { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px 14px; margin: 0; }
  .ptile dt { font: 500 12px var(--sans); color: var(--muted); white-space: nowrap; }
  .ptile dd { margin: 4px 0 0; font: 600 20px/1.1 var(--mono); color: var(--text); white-space: nowrap; }
  .ptile dd.attn { color: var(--warn); } .ptile dd.live { color: var(--accent); } .ptile dd small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .ptile .last { font-size: 12.5px; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 10px; overflow-wrap: anywhere; }
  .ptile .last .muted { color: var(--muted); }
  @media (max-width: 400px) { .ptile dl { grid-template-columns: repeat(2, auto); } }
  @media (pointer: coarse) { .ptile .ext { min-height: 44px; } }

  #detail .scen { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #detail .scen summary { cursor: pointer; font-size: 13px; line-height: 1.5; }
  #detail .scen pre { white-space: pre-wrap; font-size: 12px; max-height: 360px; overflow: auto; }
  /* The overview: what runs, what needs you, how the projects move, and what just happened */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #home { display: flex; flex-direction: column; gap: 14px; }
  .ov-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px 16px; min-width: 0; }
  .ov-card h3 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ov-card h3 .count { font: 600 12px/18px var(--mono); min-width: 18px; padding: 0 5px; border-radius: var(--r-lg); text-align: center; background: var(--surface-3); color: var(--text-2); letter-spacing: 0; }
  .ov-card h3 .linkbtn { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .ov-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 14px; }
  .ov-sit { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
  .ov-headline { margin: 0; font: 500 19px/1.35 var(--sans); color: var(--text-2); }
  .ov-headline b { font: 600 22px var(--mono); color: var(--text); } .ov-headline .live b { color: var(--accent); } .ov-headline .attn b { color: var(--warn); }
  .ov-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .ov-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ov-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-lg); font: 12px var(--mono); color: var(--text-2); white-space: nowrap; }
  .ov-chip.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
  .ov-chip.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); }
  .ov-attn:not(.calm) { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 5%, var(--surface)); }
  .ov-attn:not(.calm) h3, .ov-attn:not(.calm) h3 .count { color: var(--warn); } .ov-attn:not(.calm) h3 .count { background: var(--warn-dim); }
  .ov-run h3 .count { background: var(--accent-dim); color: var(--accent); }
  .ov-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; min-width: 0; }
  h3 + .ov-row { border-top: none; padding-top: 2px; }
  .ov-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 4px; color: inherit; text-decoration: none; border-radius: var(--r); }
  a.ov-main:hover .ov-title, a.ov-prow:hover b { color: var(--accent); }
  a.ov-main:focus-visible, a.ov-prow:focus-visible, .ov-act:focus-visible, .ov-what:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ov-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ov-title { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-meta { font: 12px var(--mono); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-when { flex: none; font: 12px var(--mono); color: var(--muted); }
  .ov-act { flex: none; display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r); font-size: 12.5px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .ov-act:hover { border-color: var(--accent); color: var(--accent); }
  .ov-steps { flex: none; display: inline-flex; gap: 3px; }
  .ov-steps i { width: 14px; height: 5px; border-radius: var(--r-sm); background: var(--surface-3); }
  .ov-steps i.done { background: color-mix(in srgb, var(--ok) 70%, transparent); } .ov-steps i.active { background: var(--accent); }
  .ov-steps i.waiting { background: var(--warn); } .ov-steps i.failed { background: var(--bad); }
  .ov-empty, .ov-more { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .ov-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-left: auto; font: 12px var(--mono); text-transform: none; letter-spacing: 0; color: var(--muted); }
  .ov-legend span { display: inline-flex; align-items: center; gap: 5px; } .ov-legend i { width: 9px; height: 9px; border-radius: 2px; }
  .ov-prow { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 110px; align-items: center; gap: 8px 20px; padding: 12px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  h3 + .ov-prow { border-top: none; padding-top: 4px; }
  .ov-pname { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-width: 0; } .ov-pname b { font: 600 15px var(--sans); color: var(--text); }
  .ov-pname .ov-meta { flex-basis: 100%; padding-left: 15px; }
  .ov-pmid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ov-bar { display: flex; gap: 2px; height: 10px; border-radius: var(--r-sm); overflow: hidden; }
  .ov-bar i { flex: 1 1 0; min-width: 4px; }
  .seg-q { background: var(--surface-3); } .seg-p { background: color-mix(in srgb, var(--accent) 45%, transparent); } .seg-b { background: var(--accent); }
  .seg-v { background: var(--accent-deep); } .seg-a { background: var(--warn); } .seg-d { background: color-mix(in srgb, var(--ok) 75%, transparent); }
  .ov-pside { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; } .ov-pside b { font: 600 15px var(--mono); color: var(--text); white-space: nowrap; }
  @media (max-width: 640px) { .ov-prow { grid-template-columns: 1fr auto; } .ov-pmid { grid-column: 1 / -1; grid-row: 2; } .ov-legend { margin-left: 0; } }
  .ov-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .ov-facts div { display: flex; flex-direction: column; gap: 3px; min-width: 0; } .ov-facts b { font: 600 20px var(--mono); color: var(--text); white-space: nowrap; }
  .ov-facts span { font-size: 12px; color: var(--muted); }
  .ov-label { font: 12px var(--mono); color: var(--muted); margin: 8px 0 4px; }
  .ov-bars { display: flex; align-items: flex-end; gap: 3px; height: 46px; } .ov-bars.tok { height: 30px; }
  .ov-bars i { flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; } .ov-bars.done i { background: color-mix(in srgb, var(--ok) 75%, transparent); } .ov-bars.tok i { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .ov-bars i:hover { filter: brightness(1.25); }
  .ov-note { font-size: 12px; color: var(--text-2); margin-top: 10px; }
  .ov-axis { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); margin-top: 4px; }
  .ov-quota { display: flex; flex-direction: column; gap: 14px; }
  .meter b.ghost { position: absolute; top: 0; bottom: 0; border: 1px dashed var(--accent); border-left: none; border-radius: 0 var(--r-sm) var(--r-sm) 0; z-index: 1; }
  .meter.high b.ghost { border-color: var(--warn); }
  .q-pace { color: var(--text-2); } .q-pace.warn { color: var(--warn); }
  .ov-feedlist { list-style: none; margin: 0; padding: 0; }
  .ov-feedlist li { display: grid; grid-template-columns: 8px 92px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .ov-feedlist li:first-child { border-top: none; }
  .ov-feedlist time { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .ov-what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); text-decoration: none; } a.ov-what:hover { color: var(--text); }
  .ov-what b { color: var(--text); font-weight: 600; }
  .tone-ok .led { background: var(--ok); } .tone-warn .led { background: var(--warn); } .tone-bad .led { background: var(--bad); } .tone-info .led { background: var(--muted); }
  .tone-ok .ov-text { color: var(--ok); } .tone-warn .ov-text { color: var(--warn); } .tone-bad .ov-text { color: var(--bad); }
  @media (max-width: 640px) { .ov-feedlist li { grid-template-columns: 8px 70px minmax(0, 1fr); } .ov-feedlist li > .ov-meta { display: none; } }

  /* The overview has no line of its own; an unknown project shows only its notice */
  body[data-view="home"] :is(#top, #orch, #attention, #flow, #done, #overview, #space),
  body[data-view="missing"] :is(#top, #orch, #attention, #flow, #done, #overview, #space) { display: none !important; }

  /* Disk: everything the project's runners keep on this machine */
  #space .sp-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 12px; }
  #space .sp-sum .fig { display: grid; } #space .sp-sum .fig b { font: 600 18px/1.2 var(--mono); } #space .sp-sum .fig span { font-size: 12px; color: var(--muted); }
  #space .sp-sum .fig.go b { color: var(--ok); }
  #space .sp-sum .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #space button.sp-btn { min-height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--text); font: 500 12px var(--mono); cursor: pointer; }
  #space button.sp-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #space button.sp-btn:disabled { opacity: .55; cursor: default; }
  #space .sp-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--accent); border-radius: var(--r); background: var(--accent-dim); font-size: 13px; }
  #space .sp-note { margin: 0 0 12px; font-size: 12.5px; color: var(--text-2); }
  #space .sp-note.bad { color: var(--bad); }
  #space .sp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 12px; }
  #space .sp-run { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
  #space .sp-run header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #space .sp-run header b { font: 600 13.5px var(--mono); } #space .sp-run header .tot { margin-left: auto; font: 600 13px var(--mono); }
  #space .sp-run .job { font-size: 12px; color: var(--muted); width: 100%; }
  #space .sp-bar { display: flex; height: 10px; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-3); gap: 1px; }
  #space .sp-bar i { display: block; height: 100%; }
  #space .sp-items { display: grid; gap: 2px; }
  #space .sp-item { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  #space .sp-item .dot { width: 9px; height: 9px; border-radius: 2px; align-self: center; }
  #space .sp-item .t { min-width: 0; overflow-wrap: anywhere; } #space .sp-item .sz { font: 600 12px var(--mono); text-align: right; }
  #space .sp-item .why { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
  #space .sp-item .why.go { color: var(--ok); }
  #space .sp-empty { padding: 18px; border: 1px dashed var(--line-2); border-radius: var(--r-lg); color: var(--muted); font-size: 13px; }

  /* Needs you: questions, stopped tickets and pull requests waiting for the merge */
  #attention { padding: 16px; border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: var(--r-lg);
    background: color-mix(in srgb, var(--warn) 5%, transparent); }
  #attention .sectionhead h2 { color: var(--warn); }
  #attention.folded { padding-block: 10px; } #attention.folded .sectionhead { margin: 0; }
  #flow.folded > .sectionhead, #done.folded > .sectionhead, #space.folded > .sectionhead { margin-bottom: 0; }
  .sectionhead.can-fold { cursor: pointer; user-select: none; }
  .foldbtn { display: inline-grid; place-items: center; width: 24px; height: 24px; margin: 0 -4px 0 -6px; padding: 0; border: none; border-radius: var(--r);
    background: transparent; color: var(--muted); cursor: pointer; font: 600 14px var(--mono); }
  .foldbtn::before { content: "›"; display: inline-block; transform: rotate(90deg); transition: transform .15s; }
  .foldbtn[aria-expanded="false"]::before { transform: none; }
  .foldbtn:hover { color: var(--text); background: var(--surface-3); }
  .foldbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (pointer: coarse) { .foldbtn { width: 44px; height: 44px; margin-block: -10px; } }
  #attention .sectionhead .count { background: var(--warn-dim); color: var(--warn); }
  #attention .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; }
  .item { display: flex; flex-direction: column; min-width: 0; }
  .item .card { margin: 0; flex: 1; }
  .item:has(.actions) .card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px 8px 14px; border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 var(--r) var(--r); background: var(--surface); }
  .actions a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r);
    font: 500 12px var(--mono); color: var(--text); text-decoration: none; transition: border-color .15s, background .15s; }
  .actions a:hover { border-color: var(--accent); }
  .actions a.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .actions a.primary:hover { background: var(--accent-hover); }
  .actions button { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--line-2);
    border-radius: var(--r); font: 500 12px var(--mono); color: var(--text); background: var(--surface); cursor: pointer;
    transition: border-color .15s, background .15s; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .actions button.primary:hover { background: var(--accent-hover); }
  .actions button:disabled, .links button:disabled { opacity: .6; cursor: default; }
  @media (pointer: coarse) { .actions a, .actions button { min-height: 44px; } }

  /* The line: one lane per station, left to right */
  .lanes { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 14px; align-items: stretch; }
  @media (max-width: 1100px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) {
    .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .lane.busy { grid-column: 1 / -1; }
    .lane:not(.busy) h3 { margin-bottom: 2px; }
    .lane .empty { display: none; }
  }
  .lane { position: relative; min-width: 0; background: var(--col); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; scroll-margin-top: calc(var(--appbar) + 14px); }
  .lane.busy { border-color: var(--line-2); }
  .lane.running { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  @media (min-width: 1101px) {
    .lane:not(:last-child)::after { content: ""; position: absolute; right: -11px; top: 19px; width: 7px; height: 7px; z-index: 1;
      border-top: 2px solid var(--line-3); border-right: 2px solid var(--line-3); transform: rotate(45deg); }
    .lane.running:not(:last-child)::after { border-color: var(--accent); }
  }
  .lane h3 { display: flex; align-items: center; gap: 8px; margin: 2px 4px 12px; font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .lane h3 .idx { color: var(--muted); font-weight: 500; }
  .lane h3 .count { margin-left: auto; font-weight: 600; color: var(--muted); }
  .lane.busy h3 .count { color: var(--text); }
  .lane.running h3 .count { color: var(--accent); }
  .lane .empty { color: var(--muted); font: 12px var(--mono); padding: 22px 8px; border: 1px dashed var(--line-2); border-radius: var(--r); text-align: center; }

  .card { position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 12px 11px 15px; margin-bottom: 8px;
    transition: border-color .15s, background .15s, box-shadow .15s; overflow: hidden; }
  .card:last-child { margin-bottom: 0; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line-2); }
  .card.running::before { background: var(--accent); }
  .card.s-attn::before { background: var(--warn); } .card.s-ok::before { background: var(--ok); } .card.s-bad::before { background: var(--bad); }
  .card.s-review::before { background: var(--violet); }
  .card:hover { border-color: var(--line-3); background: var(--card-hover); }
  .card.running { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .top { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); min-width: 0; }
  .card .top .repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .top .num { margin-left: auto; color: var(--text-2); }
  .card .top .where { flex: none; padding: 1px 7px; border-radius: var(--r-sm); font-weight: 600; letter-spacing: .03em; color: var(--warn); background: var(--warn-dim); }
  .card.s-review .top .where { color: var(--violet); background: color-mix(in srgb, var(--violet) 14%, transparent); }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.4; margin: 7px 0; overflow-wrap: anywhere; color: var(--text); }
  .card .step { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); }
  .card.running .step { color: var(--accent); }
  /* What a running ticket costs this machine now: share of all cores and of all RAM. The number is the message, the bar a hint. */
  .card .load { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .card .gauge { display: flex; align-items: center; gap: 6px; min-width: 0; font: 12px var(--mono); color: var(--muted); }
  .card .gauge .bar { flex: 1; min-width: 24px; height: 5px; border-radius: var(--r-sm); background: var(--line-2); overflow: hidden; }
  .card .gauge .bar i { display: block; height: 100%; border-radius: var(--r-sm); background: var(--accent); transition: width .4s ease-out; }
  .card .gauge b { min-width: 4ch; text-align: right; font-weight: 600; color: var(--text-2); }
  .card .gauge.mid .bar i { background: var(--warn); } .card .gauge.mid b { color: var(--warn); }
  .card .gauge.hi .bar i { background: var(--bad); } .card .gauge.hi b { color: var(--bad); }
  @media (prefers-reduced-motion: reduce) { .card .gauge .bar i { transition: none; } }
  .card .detail { font-size: 12.5px; color: var(--warn); margin-top: 6px; overflow-wrap: anywhere; }
  .card .foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .card .foot:empty { display: none; }
  .card .foot .when { margin-left: auto; font: 12px var(--mono); color: var(--muted); align-self: center; }

  /* Finished: a dense list, newest work stays one click away */
  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .rowbtn { display: grid; grid-template-columns: 8px 44px minmax(0, 1fr) auto 72px 86px; gap: 14px; align-items: center; width: 100%; min-height: 52px;
    padding: 8px 16px; border: none; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: background .15s; }
  .rowbtn:first-child { border-top: none; }
  .rowwrap { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
  .rowwrap:first-child { border-top: none; }
  .rowwrap .rowbtn { border-top: none; flex: 1; min-width: 0; }
  .rowwrap .prlink { display: inline-flex; align-items: center; padding: 0 16px; border-left: 1px solid var(--line);
    font: 12px var(--mono); white-space: nowrap; color: var(--accent); text-decoration: none; }
  .rowwrap .prlink:hover { background: var(--surface-2); text-decoration: underline; }
  #overview td a.prlink { font: 12px var(--mono); margin-left: 6px; }
  .rowbtn:hover { background: var(--surface-2); }
  .rowbtn.selected { background: var(--accent-dim); box-shadow: inset 3px 0 0 var(--accent); }
  .rowbtn .num { font: 12px var(--mono); color: var(--muted); }
  .rowbtn .t { min-width: 0; }
  .rowbtn .t b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowbtn .t span { display: block; font: 12px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .rowbtn .cost, .rowbtn .when { font: 12px var(--mono); color: var(--text-2); text-align: right; white-space: nowrap; }
  .rowbtn .when { color: var(--muted); }
  @media (max-width: 760px) {
    .rowbtn { grid-template-columns: 8px minmax(0, 1fr); gap: 6px 12px; padding: 10px 14px; }
    .rowbtn .num, .rowbtn .cost, .rowbtn .when { display: none; }
    .rowbtn .chip { grid-column: 2; justify-self: start; }
    .rowbtn .led { align-self: start; margin-top: 6px; }
  }
  .more { margin-top: 12px; }
  .donesearch { margin-left: auto; width: min(320px, 100%); }
  .donesearch input { padding: 6px 10px; font-size: 13px; }
  #done .rows .empty { padding: 16px; color: var(--muted); font-size: 13px; }

  /* Overview table */
  #overview > summary { margin: 0 0 12px; }
  #overview > summary::before { order: -1; }
  #overview .explain, #home .explain { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
  #overview table { border-collapse: collapse; width: 100%; min-width: 1020px; font: 12px var(--mono); }
  #overview th { text-align: left; font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    padding: 10px; white-space: nowrap; border-bottom: 1px solid var(--line-2); background: var(--surface-2); position: sticky; top: 0; }
  #overview td { padding: 7px 10px; border-top: 1px solid var(--line); white-space: nowrap; color: var(--text-2); vertical-align: top; }
  #overview td.wrap { white-space: normal; min-width: 170px; font-family: var(--sans); font-size: 12.5px; color: var(--text); }
  #ov-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  #ov-tools input { width: min(300px, 100%); padding: 6px 10px; }
  #ov-tools select { width: auto; min-width: 150px; padding-block: 6px; }
  #ov-tools .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
  #ov-tools .seg button { border: none; background: transparent; color: var(--text-2); font: 12px var(--sans); padding: 6px 10px; cursor: pointer; min-height: 32px; }
  #ov-tools .seg button + button { border-left: 1px solid var(--line-2); }
  #ov-tools .seg button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
  #overview th .sorter { all: unset; cursor: pointer; min-height: 24px; display: inline-flex; align-items: center; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
  #overview th .sorter:hover { color: var(--text); } #overview th .sorter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #overview th[aria-sort="ascending"], #overview th[aria-sort="descending"] { color: var(--accent); }
  #overview .ov-empty { padding: 18px; border: 1px dashed var(--line-2); border-radius: var(--r-lg); color: var(--muted); font-size: 13px; }
  #overview tr.row { cursor: pointer; } #overview tr.row:hover td, #overview tr.row:focus-visible td { background: var(--surface-2); }
  #overview tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Small text links and fold heads get a target a pointer can hit: at least 24 px high. */
  #scope a, #scope .linkbtn, summary.sectionhead { min-height: 24px; display: inline-flex; align-items: center; }
  summary.sectionhead { display: flex; }
  #overview .prlink { display: inline-block; padding: 4px 0; margin: -4px 0; }   /* a bigger hit area, the row keeps its height */
  #overview tfoot td { font-weight: 600; color: var(--text); border-top: 1px solid var(--line-2); background: var(--surface-2); }
  .sub { color: var(--muted); display: block; font-size: 12px; }

  /* Drawer: the workflow of one ticket. Most important first: what is happening, what to do, how far it is. */
  #panel { position: fixed; top: var(--appbar); right: 0; bottom: 0; width: min(460px, 100vw); background: var(--bg-2);
    border-left: 1px solid var(--line-2); padding: 18px 20px 40px; overflow-y: auto; display: none; z-index: 10;
    box-shadow: -20px 0 40px color-mix(in srgb, var(--shadow) 35%, transparent); }
  body.open #panel { display: block; }
  #panel .close { float: right; margin: -4px -6px 0 8px; }
  #panel .crumb { font: 12px var(--mono); color: var(--muted); }
  #panel h2 { font: 600 19px/1.3 var(--sans); margin: 6px 0 12px; overflow-wrap: anywhere; text-wrap: balance; color: var(--text); }
  #panel p { margin: 4px 0; font-size: 13.5px; line-height: 1.55; color: var(--text-2); }
  #panel ul { margin: 4px 0; padding-left: 18px; } #panel ul li { margin: 4px 0; font-size: 13.5px; line-height: 1.5; color: var(--text-2); }

  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: var(--r-pill); font: 600 12.5px var(--sans);
    background: var(--surface-3); color: var(--text); }
  .pill.run { background: var(--accent-dim); color: var(--accent); } .pill.warn { background: var(--warn-dim); color: var(--warn); }
  .pill.bad { background: var(--bad-dim); color: var(--bad); } .pill.ok { background: var(--ok-dim); color: var(--ok); }
  .pill.review { background: color-mix(in srgb, var(--violet) 14%, transparent); color: var(--violet); }
  .status .when { font-size: 12.5px; color: var(--muted); }
  .detail { font-size: 12.5px; color: var(--warn); margin-top: 8px; padding: 8px 10px; border-radius: var(--r); background: var(--warn-dim); overflow-wrap: anywhere; }
  #panel .questions { margin: 0 0 12px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--r); background: var(--surface-2); }
  #panel .questions ol { margin: 6px 0 8px; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; line-height: 1.5; color: var(--text); }
  #panel .questions .answer { font: 600 12px var(--mono); }
  .card ol.asked { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.45; color: var(--text); display: grid; gap: 3px; }
  .card ol.asked li { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #panel .detail { font-size: 13px; line-height: 1.5; margin: 0 0 12px; padding: 10px 12px; white-space: pre-wrap; max-height: 180px; overflow-y: auto; }

  .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .links a, .links button { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r);
    font: 500 12.5px var(--sans); color: var(--text); background: var(--surface); text-decoration: none; cursor: pointer; transition: border-color .15s, background .15s; }
  .links a:hover, .links button:hover { border-color: var(--accent); }
  /* Abort: apart from the other actions (pushed to the end of the row) and in the colour of a stop. */
  .links button.abort { margin-left: auto; gap: 6px; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
  .links button.abort:hover { border-color: var(--bad); background: var(--bad-dim); }
  .links button.abort:focus-visible, #abortdlg button:focus-visible { outline: 2px solid var(--bad); outline-offset: 2px; }
  @media (pointer: coarse) { .links a, .links button { min-height: 44px; } }
  #abortdlg { width: min(480px, calc(100vw - 32px)); padding: 20px 22px; border: 1px solid var(--line-2); border-radius: var(--r-lg);
    background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
  #abortdlg::backdrop { background: rgba(0, 0, 0, .55); }
  #abortdlg h2 { margin: 0 0 6px; font: 600 17px var(--sans); }
  #abortdlg .abort-ticket { margin: 0 0 12px; color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
  #abortdlg ul { margin: 0 0 14px; padding-left: 18px; font-size: 13.5px; line-height: 1.55; }
  #abortdlg li + li { margin-top: 4px; }
  #abortdlg .abort-note { min-height: 0; font-size: 13px; margin: 0 0 12px; }
  #abortdlg .abort-note:empty { display: none; }
  #abortdlg .abort-note.ok { color: var(--ok); } #abortdlg .abort-note.bad { color: var(--bad); }
  #abortdlg .abort-buttons { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  #abortdlg button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: var(--r);
    font: 600 13px var(--sans); cursor: pointer; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); }
  #abortdlg button.stop { background: var(--bad); border-color: var(--bad); color: var(--bg); }
  #abortdlg button.stop:hover:not(:disabled) { filter: brightness(1.08); }
  #abortdlg button:disabled { opacity: .65; cursor: default; }
  @media (prefers-reduced-motion: no-preference) { #abortdlg[open] { animation: abort-in .14s ease-out; } }
  @keyframes abort-in { from { opacity: 0; transform: translateY(6px); } }
  .links .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .links .primary:hover { background: var(--accent-hover); }
  @media (pointer: coarse) { .links a, .links button { min-height: 44px; } }

  .fplist { list-style: none; margin: 8px 0 10px; padding: 0; display: grid; gap: 10px; }
  .fplist > li > ul { list-style: none; margin: 4px 0 0; padding: 0 0 0 14px; border-left: 1px solid var(--line); display: grid; gap: 5px; }
  .fphead { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .fpmark { font: 600 12px var(--mono); padding: 1px 6px; border-radius: var(--r-sm); }
  .fpmark.new { color: var(--ok); background: var(--ok-dim); } .fpmark.changed { color: var(--warn); background: var(--warn-dim); }
  .fplist code { font-size: 12px; } .fpstat { font: 12px var(--mono); color: var(--muted); }
  .fpdesc { font-size: 12.5px; color: var(--text-2); }
  .progress { margin: 0 0 16px; }
  .progress .bar { display: flex; gap: 3px; height: 6px; }
  .progress .bar i { flex: 1; border-radius: var(--r-sm); background: var(--surface-3); }
  .progress .bar i.done { background: color-mix(in srgb, var(--ok) 70%, transparent); } .progress .bar i.active { background: var(--accent); }
  .progress .bar i.waiting { background: var(--warn); } .progress .bar i.failed { background: var(--bad); }
  .progress .bar i.skipped { background: repeating-linear-gradient(135deg, var(--surface-3) 0 3px, transparent 3px 6px); }
  .progress .lbl { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 6px; }
  #panel .evpair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 0 0 12px; }
  #panel .evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  #panel .evtitle { margin: 6px 0 6px; font-size: 13px; color: var(--text-2); }
  #panel figure.ev { margin: 0; min-width: 0; }
  #panel figure.ev figcaption { font: 12px var(--mono); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  #panel .evgrid + .hintline, #panel .evpair + .hintline { margin-top: 10px; }
  #panel .evimg { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2, transparent);
    cursor: zoom-in; overflow: hidden; aspect-ratio: 16 / 10; }
  #panel .evimg img { width: 100%; height: 100%; max-width: 100%; object-fit: contain; display: block; }
  #panel .evimg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #evview { max-width: min(96vw, 1700px); max-height: 94vh; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-lg);
    background: var(--bg, #111); color: var(--text, inherit); }
  #evview::backdrop { background: rgba(0, 0, 0, .7); }
  #evview img { max-width: 100%; max-height: calc(94vh - 80px); display: block; margin: 0 auto; cursor: zoom-out; }
  #evview .evcap { font: 12px var(--mono); color: var(--muted); margin: 8px 0; }
  #evview .evclose { min-height: 36px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; min-width: 0; }
  .stat b { display: block; font: 600 15px var(--mono); margin-top: 4px; color: var(--text); white-space: nowrap; }
  @media (max-width: 420px) { .stat { padding: 8px 9px; } .stat b { font-size: 13.5px; } }

  #panel .sec { margin-top: 22px; }
  #panel .sec > summary, #panel h3 { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2);
    margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

<aside id="panel" aria-label="Ablauf des Tickets"></aside>
<script>
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ago = ts => { const s = (Date.now() - Date.parse(ts)) / 1000;
  return s < 90 ? "gerade eben" : s < 5400 ? `vor ${Math.round(s / 60)} min` : s < 129600 ? `vor ${Math.round(s / 3600)} h` : `vor ${Math.round(s / 86400)} Tagen`; };
const link = (href, text) => { const a = el("a", null, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; };
const key = c => c.repo + "#" + c.number;
const TOKEN = "__TOKEN__";
// A ticket that broke off or was stopped starts again where its state stands. Tickets of a local run have no button.
const canRestart = c => c.restartable && String(c.source || "").startsWith("gh:");
const restartText = c => c.column === "stopped" ? "Neu starten" : "Erneut anstoßen";
async function restart(c, button) {
  const what = c.column === "stopped"
    ? `#${c.number} an der Station neu starten, an der es angehalten hat? Das Budget beginnt von vorn.`
    : `#${c.number} erneut anstoßen? Es läuft in seiner Phase weiter. Ein Lauf, der noch arbeitet, wird nicht verdoppelt: der neue wartet dahinter.`;
  return kick(c, button, what, "/api/restart");
}
// A pull request whose judge found something: one more round with the judge's findings, the PR is updated after it.
const canRework = c => String(c.source || "").startsWith("gh:") && c.column === "review" && c.pr_url && c.verdict
  && c.verdict.passed === false && !c.running && !c.restarting;
function reworkButton(c) {
  const b = el("button", null, "Nachbessern"); b.type = "button";
  b.title = `Der Richter fand Fehlerbilder (${c.verdict.text}). Das Ticket geht damit zurück an den Implementierer; danach wird der Pull Request aktualisiert.`;
  b.onclick = e => { e.stopPropagation(); kick(c, b, `#${c.number} nachbessern lassen? Die Fehlerbilder des Richters (${c.verdict.text}) und deine Kommentare seit dem Pull Request gehen an den Implementierer; danach wird der Pull Request aktualisiert und wartet wieder auf dich.`, "/api/rework"); };
  return b;
}
async function kick(c, button, what, path, extra) {
  if (!confirm(what)) return;
  button.disabled = true; button.textContent = "wird angestoßen …";
  try {
    const answer = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Factory-Token": TOKEN },
      body: JSON.stringify({ source: c.source, number: c.number, ...(extra || {}) }) });
    if (answer.status === 403) {   // the board restarted with a new token since this page was loaded
      alert("Die Seite ist veraltet, weil das Board neu gestartet wurde. Sie lädt jetzt neu; dann bitte noch einmal klicken.");
      return location.reload();
    }
    if (!answer.ok) throw new Error("Das Board antwortete mit " + answer.status);
    const res = await answer.json();
    button.textContent = res.error ? "Fehler" : "angestoßen ✓";
    if (res.error) alert("Fehlgeschlagen: " + res.error);
  } catch (e) { button.textContent = "Fehler"; alert("Fehlgeschlagen: " + e.message); }
  setTimeout(refresh, 1500);
}
// Stopping a ticket, whatever it is doing. Its own colour and place, and a question first: it ends work in progress.
const canAbort = c => String(c.source || "").startsWith("gh:") && !["done", "proposed"].includes(c.column) && !c.aborted;
const STOP_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/></svg>';
function abortButton(c) {
  const b = el("button", "abort"); b.type = "button";
  b.innerHTML = STOP_ICON; b.append("Abbrechen");
  b.title = "Hält das Ticket sofort an, in jeder Phase";

}
function askAbort(c, trigger) {

    dlg.setAttribute("role", "alertdialog"); dlg.setAttribute("aria-labelledby", "abort-title"); dlg.setAttribute("aria-describedby", "abort-what");

  delete dlg.dataset.busy;

  const what = el("div"); what.id = "abort-what";

  const ul = el("ul");
  ["Laufende Läufe auf GitHub werden sofort abgebrochen. Was ein Agent noch nicht gespeichert hat, geht verloren.",
   "Branch, Pull Request und der bisherige Stand bleiben erhalten.",
   "Weder der Orchestrator noch ein Kommentar startet das Ticket wieder.",

  what.append(ul);

    .then(data => { sessions[k] = { ...data, at: Date.now() }; }).catch(e => { sessions[k] = { error: e.message, at: Date.now() }; })
    .finally(() => { loading[k] = false; draw(); });
}

// The recorded session of one run: runs of a station are matched by task, in order.
function sessionOf(c, s, r, idx) {
  const st = ((sessions[key(c)] || {}).stations || {})[s.id];
  if (!st) return undefined;
  const nth = s.runs.slice(0, idx).filter(x => (x.task || "") === (r.task || "")).length;
  return st.runs.filter(x => (x.meta.task || "") === (r.task || ""))[nth] || null;
}

// What an agent reported at the end of its step: its last words, which the factory asks to be a summary.
function said(run) {
  if (!run) return "";
  const last = [...run.entries].reverse().find(e => e.type === "text");
  return ((run.final || "").trim() || (last ? last.text : "")).trim();
}

// An agent's text with its **bold** and `code` shown as such; built from text nodes, never as HTML.
function prose(text) {
  const box = el("div", "said");
  for (const part of text.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/)) {
    if (part.startsWith("**") && part.endsWith("**") && part.length > 4) box.append(el("b", null, part.slice(2, -2)));
    else if (part.startsWith("`") && part.endsWith("`") && part.length > 2) box.append(el("code", null, part.slice(1, -1)));
    else if (part) box.append(part);
  }
  return box;
}

// One agent step: a line that opens into its summary and the numbers behind it.
function stepFold(c, s, r, idx) {
  const id = `run-${c.number}-${s.id}-${idx}`, d = el("details", "step");
  const sm = el("summary"); sm.append(runLine(r)); d.append(sm);
  d.open = !!folds[id];
  // Setting open on a fresh element fires toggle too; only a real change redraws, or the redraw would never end.
  d.ontoggle = () => { if (!!folds[id] === d.open) return; folds[id] = d.open; if (d.open) ensureSessions(c); draw(); };
  d.onclick = e => e.stopPropagation();                     // opening a step does not open the sessions pane
  if (!d.open) return d;
  const run = sessionOf(c, s, r, idx), text = said(run);
  const box = el("div", "stepbody");
  ensureSessions(c);
  if (run === undefined) box.append(el("div", "hintline", "Zusammenfassung lädt …"));
  else if (text) box.append(prose(text.length > 1400 ? text.slice(0, 1400) + " …" : text));
  else box.append(el("div", "hintline", c.running && s.state === "active" ? "Der Schritt läuft noch; seine Zusammenfassung kommt am Ende." : "Zu diesem Schritt ist keine Zusammenfassung erhalten."));
  const tools = Object.entries(r.tools).sort((a, b) => b[1] - a[1]).map(([n, k]) => `${n} ${k}`);
  const facts = [r.turns ? r.turns + " Schritte" + (r.subagents ? ` · ${r.subagents} Subagents` : "") : "",
                 tools.length ? "Tools: " + tools.join(" · ") : "", r.tokens ? tokens(r.tokens) : "",
                 r.context_peak ? context(r.context_peak, r.context_window) : "", rtkLine(r.rtk), r.where ? "Ort: " + r.where : ""].filter(Boolean);
  facts.forEach(f => box.append(el("div", "fact", f)));
  if (r.skills_used) {
    const unused = r.skills_offered.filter(k => !r.skills_used.includes(k));
    if (r.skills_used.length) box.append(el("div", "sskill", "Skills benutzt: " + r.skills_used.map(short).join(", ")));
    if (unused.length) box.append(el("div", "sskill unused", "angeboten, nicht benutzt: " + unused.map(short).join(", ")));
  }
  const open = el("button", "linkbtn", "ganze Sitzung ansehen ›"); open.type = "button";
  open.onclick = e => { e.stopPropagation(); station = s.id; shown = ""; draw(); load(c); };
  box.append(open);
  d.append(box);
  return d;
}

  const prog = el("div", "progress"), bar = el("div", "bar");

    const body = el("div"), headline = el("div", "shead");

    if (flag) headline.append(el("span", "chip " + flag[1], flag[0]));
    const used = MONEY ? s.cost : runTokens(s.runs);

      runs.append(line);

  }
  p.append(steps);

  // 4. What was asked for, what the reviewers and the judge found.
  const findings = [...(w.review ? w.review.blocking : []), ...(w.failures || [])];
  if (w.review && (w.review.blocking.length || w.review.minor.length) || (w.failures || []).length || w.notes.length) {
    const d = fold("findings", "Befunde", true, findings.length ? el("span", "n", `${findings.length} blockierend`) : null);
    const part = (title, items, linkify) => { if (!items || !items.length) return; d.append(el("p", null, title)); const ul = el("ul"); items.forEach(i => ul.append(linkify ? linked("li", null, i) : el("li", null, i))); d.append(ul); };

    part("Richter, Fehlerbilder:", w.failures); part("Hinweise:", w.notes, true);

  if (w.mandate || (w.acceptance || []).length || w.tasks.length) {

    const d = fold("mandate", "Auftrag & Plan", false, w.tasks.length ? el("span", "n", `${doneTasks}/${w.tasks.length} Tasks`) : null);
    if (w.mandate) d.append(el("p", null, w.mandate));
    if ((w.acceptance || []).length) { d.append(el("p", null, "Abnahmekriterien:")); const ul = el("ul"); w.acceptance.forEach(a => ul.append(el("li", null, a))); d.append(ul); }
    if (w.tasks.length) {
      d.append(el("p", null, "Plan:")); const ul = el("ul", "tasks");
      w.tasks.forEach(t => { const li = el("li"); li.append(el("span", t.done ? "ok" : "", t.done ? "✓" : "○"), el("span", "id", t.id), el("span", null, t.title)); ul.append(li); });
      d.append(ul);
    }
    p.append(d);
  }

  // 5. Every tool call while it works.
  if (w.activity.length) {
    const live = c.running ? (() => { const l = el("span", "live"); l.append(el("span", "led run"), "live"); return l; })() : el("span", "n", String(w.activity.length));
    const d = fold("activity", "Aktivität", !!c.running, live);
    const ul = el("ul", "act");
    for (const a of [...w.activity].reverse()) {                 // newest first
      const li = el("li"); const what = el("span", "what"); what.append(el("strong", null, a.tool + " "));

    p.append(d);
  }

  // 6. For digging: where the work lies, what it used, every event.
  const d = fold("tech", "Technik", false);
  const kv = el("dl", "kv");
  const pair = (k, v) => { if (!v) return; kv.append(el("dt", null, k)); const dd = el("dd"); dd.append(v); kv.append(dd); };
  if (c.branch) { const v = el("span"); v.append(c.branch_url ? link(c.branch_url, c.branch) : el("code", null, c.branch)); if (c.base) v.append(" → " + c.base); pair("Branch", v); }
  pair("Worktree", c.worktree ? el("code", null, c.worktree) : null);
  for (const wk of c.workers || []) pair(`Arbeiter ${wk.task}`, el("code", null, wk.worktree));
  if (w.totals.tokens && Object.keys(w.totals.tokens).length) pair("Tokens", tokens(w.totals.tokens).replace("Tokens: ", ""));
  if (plan(w.totals.subscription)) pair("Claude-Abo", plan(w.totals.subscription));
  if (w.run_urls.length > 1) { const v = el("span"); w.run_urls.forEach((u, i) => { if (i) v.append(" · "); v.append(link(u, `${i + 1}`)); }); pair("Läufe", v); }
  if (kv.children.length) d.append(kv);
  const t = el("table", "tl");
  for (const e of w.timeline) {
    const tr = el("tr");
    tr.append(el("td", null, new Date(e.ts).toLocaleTimeString("de-DE")), el("td", null, e.outcome === "auto_restart" ? "Orchestrator" : e.station),
              el("td", /^(fail|error|work_lost|over_limit|aborted|reverted|parallel_conflict|escalated)/.test(e.outcome || "") ? "bad" : null, e.outcome), linked("td", null, e.detail));
    t.append(tr);
  }
  if (w.timeline.length) d.append(el("p", "tl-head", `Verlauf · ${w.timeline.length} Ereignisse`), t);
  p.append(d);
}

async function load(c) {
  if (!c || !station) return;
  if (station === "ci") return detail();
  try {
    const data = await (await fetch(`/api/ticket?source=${encodeURIComponent(c.source)}&number=${c.number}`)).json();
    sessions[key(c)] = data;
  } catch (e) { sessions[key(c)] = { error: e.message }; }
  detail();
}

// Which session of a station is shown; by default the newest one.
const picked = {};

// One agent session, told as what it did: its result first, then its messages with the tool calls between them bundled.
function session(box, c, st) {
  const k = key(c) + "/" + station, runs = st.runs;
  const idx = Math.min(picked[k] ?? runs.length - 1, runs.length - 1);
  if (runs.length > 1) {
    const tabs = el("div", "stabs"); tabs.setAttribute("role", "tablist");
    runs.forEach((run, i) => {
      const m = run.meta, b = el("button", i === idx ? "on" : "");
      b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(i === idx));
      b.append(el("b", null, m.task || run.label || `Sitzung ${i + 1}`), el("span", null, [m.model, m.seconds ? dur(m.seconds) : "läuft"].filter(Boolean).join(" · ")));
      b.onclick = () => { picked[k] = i; shown = ""; detail(); document.getElementById("detail").scrollTop = 0; };
      tabs.append(b);
    });
    box.append(tabs);
  }
  const run = runs[idx], m = run.meta;
  const facts = el("div", "sfacts");
  [m.model, m.effort ? "Effort " + m.effort : "", m.seconds ? dur(m.seconds) : "läuft", m.turns ? m.turns + " Schritte" : "",
   (MONEY ? m.cost : tsum(m.tokens)) ? amount(m.cost, tsum(m.tokens)) : "", m.state && m.state !== "ok" ? m.state : ""]
    .filter(Boolean).forEach(f => facts.append(el("span", "chip", f)));
  box.append(facts);

  // 1. What came out: the agent's own last words.
  const last = [...run.entries].reverse().find(e => e.type === "text"), final = (run.final || "").trim() || (last ? last.text.trim() : "");
  const res = el("section", "result"); res.append(el("div", "eyebrow", m.seconds ? "Ergebnis" : "Zuletzt gesagt"));
  res.append(final ? prose(final) : el("div", "hint", m.seconds ? "Der Agent hat keine Antwort hinterlassen." : "Der Agent arbeitet noch; sein Ergebnis steht am Ende hier."));
  box.append(res);

  // 2. The numbers and the mandate, for whoever wants them.
  const more = el("details", "fold"); more.append(el("summary", null, "Zahlen, Skills und Auftrag"));
  for (const line of [tokens(m.tokens), context(m.context_peak, m.context_window),
                      m.skills_used && m.skills_used.length ? "Skills benutzt: " + m.skills_used.map(short).join(", ") : "",
                      plan(m.subscription) ? "Abo, " + plan(m.subscription) : ""]) if (line) more.append(el("div", "hint", line));
  const prompt = run.entries.find(e => e.type === "prompt");
  if (prompt) { const d = el("details"); d.append(el("summary", null, "Auftrag an die Station"), el("pre", null, prompt.text)); more.append(d); }
  box.append(more);

  // 3. The way there: each message of the agent, and the tool calls it made before the next one.
  box.append(el("div", "eyebrow way", "Verlauf"));
  if (!run.entries.length) { box.append(el("div", "hint", "Dieser Lauf stammt aus der Zeit, bevor Sitzungen mitgeschrieben wurden. Erhalten ist nur die Antwort am Ende.")); return; }
  let group = null;
  const flush = () => { if (group) { box.append(toolGroup(group, run === runs[runs.length - 1] && !m.seconds)); group = null; } };
  for (const e of run.entries) {
    if (e.type === "text") {
      flush();
      if (m.seconds && e === last && final && e.text.trim() === final) { box.append(el("div", "hint end", "↑ Das Ergebnis oben ist die letzte Nachricht.")); continue; }
      const msg = el("div", "msg"); msg.append(el("span", "when", new Date(e.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })), prose(e.text.trim()));
      box.append(msg);
    } else if (e.type === "tool") {
      group = group || [];
      group.push({ tool: e, result: null });
    } else if (e.type === "result" && group) {
      const open = group.find(g => !g.result); if (open) open.result = e;
    }
  }
  flush();
}

// Tool calls between two messages of the agent, folded into one line that says what kind they were.
function toolGroup(items, live) {
  const d = el("details", "tools");
  const count = {}; items.forEach(i => { count[i.tool.tool] = (count[i.tool.tool] || 0) + 1; });
  const errors = items.filter(i => i.result && i.result.error).length;
  const sm = el("summary");
  sm.append(el("b", null, items.length === 1 ? "1 Tool-Aufruf" : `${items.length} Tool-Aufrufe`),
            el("span", "kinds", Object.entries(count).sort((a, b) => b[1] - a[1]).map(([n, k]) => `${n} ${k}`).join(" · ")));
  if (errors) sm.append(el("span", "chip bad", errors === 1 ? "1 Fehler" : `${errors} Fehler`));
  d.append(sm);
  d.open = live;                                             // the calls of a running step stay in view
  for (const { tool, result } of items) {
    const one = el("details", "call" + (result && result.error ? " bad" : ""));
    const line = el("summary");
    line.append(el("span", "when", new Date(tool.ts).toLocaleTimeString("de-DE")), el("span", "tname", tool.tool), el("span", "targ", tool.text || ""));
    one.append(line);
    if (tool.input && tool.input.length > (tool.text || "").length + 20) one.append(el("div", "lbl", "Eingabe"), el("pre", null, tool.input));
    one.append(el("div", "lbl", result ? (result.error ? "Fehler" : "Ergebnis") : "Ergebnis"), el("pre", null, result ? (result.text || "leer") : "noch keins"));
    d.append(one);
  }
  return d;
}

function detail() {
  const box = document.getElementById("detail");
  if (orchOpen && backlogRun && here && here.orchestrator) return backlogDetail(here);
  const c = cards.find(x => key(x) === selected);
  const open = !!(c && station);
  document.body.classList.toggle("sessions", open);
  if (!open) { box.replaceChildren(); shown = ""; return; }
  const data = sessions[key(c)];
  // The CI station draws from the board data, the others from the sessions loaded for the ticket.
  const source = station === "ci" ? (c.workflow.stations.find(x => x.id === "ci") || null) : (data || null);
  const where = key(c) + "/" + station + "/" + (picked[key(c) + "/" + station] ?? "") + "/";
  const stamp = where + JSON.stringify(source).length;

  const wasOpen = [...box.querySelectorAll("details")].map(d => d.open), top = box.scrollTop, same = shown.startsWith(where);
  shown = stamp; box.replaceChildren();
  const close = el("button", "close", "✕"); close.type = "button"; close.title = "Schließen"; close.onclick = () => { station = null; draw(); };
  const flow = c.workflow.stations.find(x => x.id === station);
  if (station === "ci") {
    box.append(close, el("div", "crumb", `${c.repo} / #${c.number} / ${flow.title}`), el("h2", null, flow.title));
    box.append(el("div", "hint", "Die Workflows des Projekts auf dem Pull Request: das, was der Branch-Schutz vor dem Merge verlangt. "
      + "Die Station „Checks“ davor sind die Kommandos aus dem Profil, die die Factory selbst im Ticket ausführt."));
    if (c.pr_url) { const l = el("div", "hint"); l.append("Pull Request: ", link(c.pr_url, prText(c.pr_url)), flow.commit ? ` · Commit ${flow.commit}` : ""); box.append(l); }
    box.append(el("div", "hint", flow.summary || ""));
    const runs = flow.checks || [];
    if (runs.length) {
      const t = el("table");
      for (const k of runs) {

// The judge's session: kept only on this machine, and shown once the ticket is done (judge.keep_session).
const judgeData = {};
const JUDGE_STEP = { scenario_writer: "Szenarien schreiben", judge: "Urteil" };
function judgeDetail(box, c, st) {
  const k = key(c), d = judgeData[k];
  const load = () => {
    if (d && d.reloading) return;
    if (d) d.reloading = true; else judgeData[k] = { loading: true };
    fetch(`/api/judge?source=${encodeURIComponent(c.source)}&number=${c.number}`).then(r => r.json())
      .then(x => { judgeData[k] = { ...x, fetched: Date.now() }; })
      .catch(e => { judgeData[k] = { error: e.message, fetched: Date.now() }; })
      .finally(() => { shown = ""; detail(); });
  };
  // A judge at work is read again every few seconds; a ticket that may still get a round, now and then.
  const live = d && (d.rounds || []).some(r => r.live);
  if (!d || (d.fetched && Date.now() - d.fetched > (live ? 4000 : c.column === "done" ? 600000 : 20000))) load();
  if (!d || d.loading) { box.append(el("div", "hint", "lädt …")); return; }
  if (d.error) { box.append(el("div", "hint", "Konnte nicht geladen werden: " + d.error)); return; }
  box.append(el("p", "lead", st.note));
  if (!d.rounds.length) {
    box.append(el("div", "hint", "Von diesem Ticket ist noch keine Sitzung des Richters da. Sie erscheint, sobald er "
      + "startet, und nur, wenn er auf diesem Rechner läuft."));
    return;
  }
  if (c.column !== "done") {
    const warn = el("div", "judgewarn");
    warn.append(el("strong", null, "Nur für dich: "), "Übernimm keine Szenarien in Kommentare am Issue. Ein Kommentar von dir geht als Hinweis an den Implementierer, und dann misst der Richter nichts mehr.");
    box.append(warn);
  }
  const rounds = [...d.rounds].reverse();   // oldest first: Runde 1, 2, …
  // What each scenario asked and how it went, newest round first.
  for (let i = rounds.length - 1; i >= 0; i--) {
    const r = rounds[i], v = r.verdict || {}, results = ((r.result || {}).results) || [];
    const byId = Object.fromEntries(results.map(x => [x.id, x]));
    const at = r.at.replace(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d).*$/, "$1-$2-$3T$4:$5:00Z");
    const state = r.state === "live" ? "läuft gerade" : r.state === "broken" ? "abgebrochen, ohne Urteil"
      : v.scenarios_total ? `${v.scenarios_passed} von ${v.scenarios_total} Szenarien erfüllt` : "ohne Urteil";
    const title = `Runde ${i + 1} · ${state} · ${when(at)}`;
    const res = el("section", "result" + (v.passed === false ? " bad" : "") + (r.live ? " live" : ""));
    const eyebrow = el("div", "eyebrow");
    if (r.live) { const l = el("span", "live"); l.append(el("span", "led run"), "live"); eyebrow.append(l, " "); }
    eyebrow.append(title); res.append(eyebrow);
    const ul = el("ul", "scen");
    for (const sc of r.scenarios) {
      const id = (sc.name.match(/-(S[0-9a-f]+)\.md$/) || [])[1], got = byId[id];
      const li = el("li"), det = el("details"), sum = el("summary");
      const ok = got ? got.satisfied : null;
      sum.append(el("span", "chip " + (ok ? "ok" : ok === false ? "bad" : ""), ok ? "erfüllt" : ok === false ? "nicht erfüllt" : r.live ? "wird geprüft" : "nicht geprüft"), " ",
        (sc.text.split("\n").find(l => l.trim() && !l.startsWith("<!--")) || sc.name).replace(/^#+\s*/, ""));
      det.append(sum);
      if (got && got.symptom) det.append(el("p", "hint", got.symptom));
      det.append(el("pre", null, sc.text.replace(/^<!--.*-->\n/, "")));
      li.append(det); ul.append(li);
    }
    if (r.scenarios.length) res.append(ul);
    box.append(res);
  }
  // A runner keeps the judge's folder between its runs of one ticket, so a round can hold several of them.
  const runs = rounds.flatMap((r, i) => {
    const many = r.runs.filter(x => x.station === "judge").length > 1;
    let n = 0;
    return r.runs.map(run => {
      if (run.station === "scenario_writer") n++;
      return { ...run, label: `Runde ${i + 1}${many ? ` · Lauf ${Math.max(n, 1)}` : ""} · ${JUDGE_STEP[run.station] || run.station}` };
    });
  });
  if (runs.length) session(box, { repo: c.repo, number: c.number + "-judge" }, { runs });
}

function overview() {

    th.append(b); head.append(th);

function draw(columns) {
  if (columns) draw.columns = columns;
  const cols = draw.columns || [], of = id => cards.filter(c => c.column === id);
  const name = id => (cols.find(c => c.id === id) || {}).title || id;

  // The orchestrator first: whether the project's line is looked after at all.
  const orch = document.getElementById("orch"); orch.replaceChildren();
  if (here && here.orchestrator) orch.append(orchStrip(here));

  // Needs you: everything that stands still until a person acts, most urgent first.
  const att = document.getElementById("attention"); att.replaceChildren();
  const waiting = cards.filter(c => ATTN.includes(c.column)).sort((x, y) => ATTN.indexOf(x.column) - ATTN.indexOf(y.column));
  att.hidden = !waiting.length;
  if (waiting.length) {
    const h = head(att, "h-attention", "Braucht dich", waiting.length, "Rückfragen, angehaltene Tickets und Pull Requests, die auf deinen Merge warten");
    if (!foldable(att, h, "attention")) {
      const grid = el("div", "grid"); waiting.forEach(c => grid.append(item(c, name(c.column)))); att.append(grid);
    }
  }

  // The line: one lane per station, every lane always visible so the way of a ticket stays readable.
  const flow = document.getElementById("flow"); flow.replaceChildren();
  const work = cols.filter(c => !ATTN.includes(c.id) && c.id !== "done");
  const busy = work.reduce((n, c) => n + of(c.id).length, 0);
  const fh = head(flow, "h-flow", "Fließband", busy, busy ? "Karte anklicken öffnet den Ablauf" : cards.length ? "gerade ist kein Ticket in Arbeit" : "noch keine Tickets");
  if (foldable(flow, fh, "flow")) {   // folded: one line with how full each lane is
    fh.querySelector(".hint").textContent = work.map(col => `${col.title} ${of(col.id).length}`).join(" · ");
  } else if (fh.append(viewSwitch()), flowView !== "kanban") {
    drawView(flow);   // line, timetable or signal box (views.js)
  } else {
  const lanes = el("div", "lanes"); lanes.style.setProperty("--n", Math.max(work.length, 1));
  work.forEach((col, i) => {
    const mine = of(col.id), running = mine.some(c => c.running);
    const lane = el("section", "lane" + (mine.length ? " busy" : "") + (running ? " running" : "")); lane.id = "col-" + col.id;
    lane.setAttribute("aria-label", `${col.title}: ${mine.length} Tickets`);
    const h = el("h3"); h.append(el("span", "led" + (running ? " run" : "")), el("span", "idx", String(i + 1).padStart(2, "0")), el("span", null, col.title), el("span", "count", String(mine.length)));
    lane.append(h);
    if (mine.length) mine.forEach(c => lane.append(c.pr_url || c.column === "stopped" ? item(c) : card(c))); else lane.append(el("div", "empty", "leer"));
    lanes.append(lane);
  });
  flow.append(lanes);
  }

  // Finished tickets pile up, so they get a dense list instead of big cards, and a search over them.
  drawDone(of("done"));
  overview();
  drawSpace();
  const actTop = document.querySelector("#panel .act")?.scrollTop || 0;
  const top = document.getElementById("panel").scrollTop;
  if (orchOpen && here && here.orchestrator) orchPanel(here);
  else panel(cards.find(c => key(c) === selected));   // open sections come back by themselves (folds)
  document.getElementById("panel").scrollTop = top;
  const act = document.querySelector("#panel .act"); if (act) act.scrollTop = actTop;
  detail();
}


// The finished list. Its head and search field are built once and kept, so the board's refresh every few
// seconds never takes the cursor out of the field; only the rows are drawn again.
let doneQuery = "";
const doneText = c => [`#${c.number}`, c.title, c.step, c.repo, c.verdict ? "Richter " + c.verdict.text : "",
  prNum(c.pr_url) ? `PR #${prNum(c.pr_url)}` : "", c.branch || ""].join(" ").toLowerCase();
function matches(c, query) {
  const text = doneText(c);   // every word must appear: "402", "#402", "formation richter" …
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(word => text.includes(word));
}
function drawDone(finished) {
  const done = document.getElementById("done");
  done.hidden = !finished.length;
  if (!finished.length) return;
  if (!done.querySelector(".donesearch")) {
    done.replaceChildren();
    const h = head(done, "h-done", "Fertig", 0, "gemergt oder verworfen");
    const box = el("label", "donesearch");
    const input = el("input"); input.type = "search"; input.placeholder = "Suchen: Nummer, Titel, PR …"; input.autocomplete = "off"; input.spellcheck = false;
    input.setAttribute("aria-label", "Fertige Tickets durchsuchen");
    input.value = doneQuery;
    input.oninput = () => { doneQuery = input.value; drawDone(cards.filter(c => c.column === "done")); };
    input.onkeydown = e => { if (e.key === "Escape" && input.value) { e.stopPropagation(); input.value = ""; input.oninput(); } };
    box.append(input); h.append(box);
    done.append(el("div", "rows"), el("div", "donemore"));
    foldable(done, h, "done");
  }
  const query = doneQuery.trim(), shown = query ? finished.filter(c => matches(c, query)) : finished;
  done.querySelector(".sectionhead .count").textContent = query ? `${shown.length} von ${finished.length}` : String(finished.length);
  const rows = done.querySelector(".rows"), more = done.querySelector(".donemore");
  // The skeleton stays across redraws (the search keeps its cursor), so the fold state is applied here each time.
  const shut = !!folded.done, fb = done.querySelector(".foldbtn");
  done.classList.toggle("folded", shut);
  fb.setAttribute("aria-expanded", String(!shut)); fb.title = shut ? "Aufklappen" : "Zuklappen";
  fb.setAttribute("aria-label", (shut ? "Aufklappen: " : "Zuklappen: ") + "Fertig");
  rows.hidden = more.hidden = done.querySelector(".donesearch").hidden = shut;
  if (shut) return;
  rows.replaceChildren(); more.replaceChildren();
  if (!shown.length) { rows.append(el("div", "empty", `Kein fertiges Ticket passt zu „${query}“.`)); return; }
  (query || draw.allDone ? shown : shown.slice(0, 8)).forEach(c => rows.append(row(c)));
  if (!query && finished.length > 8) {
    const b = el("button", "btn ghost more", draw.allDone ? "nur die neuesten 8 zeigen" : `alle ${finished.length} zeigen`);
    b.type = "button"; b.onclick = () => { draw.allDone = !draw.allDone; drawDone(cards.filter(c => c.column === "done")); }; more.append(b);
  }
}
